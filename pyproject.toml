[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcrec2mp4"
dynamic = ["version"]
description = "MeshCentral-Desktop-Aufzeichnungen (.mcrec) in MP4 umwandeln – mit Rechtsklick im Dateimanager"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Immeditech" }]
dependencies = ["Pillow>=9"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Conversion",
]

[project.optional-dependencies]
# bringt ein eigenes ffmpeg mit, falls keins installiert ist
ffmpeg = ["imageio-ffmpeg>=0.6"]
test = ["pytest>=7", "imageio-ffmpeg>=0.6"]

[project.scripts]
mcrec2mp4 = "mcrec2mp4.cli:main"

[project.urls]
Homepage = "https://github.com/immeditech/mcrec2mp4"

[tool.setuptools.dynamic]
version = { attr = "mcrec2mp4.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

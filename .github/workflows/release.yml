name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: mcrec2mp4-windows-x64.exe
          - os: ubuntu-22.04
            asset: mcrec2mp4-linux-x64
          - os: macos-latest
            asset: mcrec2mp4-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . imageio-ffmpeg pyinstaller
      - name: Einzeldatei bauen (mit ffmpeg)
        run: pyinstaller --onefile --name mcrec2mp4 --collect-all imageio_ffmpeg packaging/entry.py
      - name: Rauchtest
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); import sample; open('probe.mcrec', 'wb').write(sample.recording([(0, sample.screen(64, 48)), (0, sample.tile(0, 0, sample.png((200, 0, 0), (64, 48)))), (3000, sample.cmd(88, b''))]))"
          ./dist/mcrec2mp4 --version
          ./dist/mcrec2mp4 probe.mcrec
          test -s probe.mp4
      - name: Umbenennen
        shell: bash
        run: |
          mkdir out
          if [ -f dist/mcrec2mp4.exe ]; then cp dist/mcrec2mp4.exe "out/${{ matrix.asset }}"; else cp dist/mcrec2mp4 "out/${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd assets && sha256sum * > SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --generate-notes --notes "Die Einzeldateien enthalten ffmpeg (GPL, über imageio-ffmpeg) – siehe README, Abschnitt Lizenz."
          fi
